name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test_ormin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        nim:
          - stable
    name: Test on nim ${{ matrix.nim }}
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      
    - name: Setup nim
      uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: ${{ matrix.nim }}

    - name: Install Atlas
      run: |
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/atlas.tar.gz" \
          https://github.com/nim-lang/atlas/releases/download/0.16.3/atlas-linux-amd64.tar.gz
        echo "2515b80219fac42996db2583858233671e562cd430c1d0e8ff3e9819dd95d58e  $RUNNER_TEMP/atlas.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/atlas.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/atlas-linux-amd64" >> "$GITHUB_PATH"

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: deps/
        key: atlas-${{ runner.os }}-${{ hashFiles('ormin.nimble') }}

    - name: Install dependencies
      run: atlas install -uk --feature:examples
      
    - name: Run test sqlite
      run: nim test

    - name: Run test postgres
      run: nim test_postgres
      env:
        PGPASSWORD: test

    - name: Build examples
      run: nim buildexamples
