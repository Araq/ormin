name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test_ormin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        nim:
          - stable
    name: Test on nim ${{ matrix.nim }}
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      
    - name: Setup nim
      uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: ${{ matrix.nim }}

    - name: Install Atlas
      shell: bash
      env:
        ATLAS_INSTALL_DIR: ${{ runner.temp }}/atlas/bin
      run: |
        curl -fsSL --retry 3 \
          https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash
        echo "$ATLAS_INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: deps/
        key: atlas-${{ runner.os }}-${{ hashFiles('ormin.nimble') }}

    - name: Install dependencies
      run: atlas install -uk --feature:examples
      
    - name: Run test sqlite
      run: nim test

    - name: Run test postgres
      run: nim test_postgres
      env:
        PGPASSWORD: test

    - name: Build examples
      run: nim buildexamples
